name: Claude Code (reusable)

# Reusable workflow: phản hồi khi được tag @claude.
# Các repo trong org gọi workflow này qua `uses:` + `secrets: inherit`.
# KHÔNG đặt trigger ở đây — trigger nằm ở caller workflow của từng repo.
on:
  workflow_call:
    inputs:
      model:
        description: "Model Claude sử dụng"
        type: string
        required: false
        default: "claude-opus-4-8"
    secrets:
      ANTHROPIC_API_KEY:
        description: "API key cho endpoint Anthropic-compatible"
        required: true
      ANTHROPIC_BASE_URL:
        description: "Endpoint tùy chỉnh (Anthropic-compatible)"
        required: true

jobs:
  claude:
    # Chỉ chạy khi nội dung có chứa "@claude"
    if: |
      github.repository_owner == 'zsolution-vn' &&
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Cho phép Claude đọc kết quả CI trên PR
    steps:
      - name: Validate self-hosted runner
        shell: bash
        run: |
          set -euo pipefail

          [[ "$(uname -s)" == "Linux" ]]
          [[ "$(uname -m)" == "x86_64" ]]
          command -v python3 >/dev/null

          available_kb="$(df -Pk "${RUNNER_TEMP}" | awk 'NR == 2 { print $4 }')"
          required_kb="$((2 * 1024 * 1024))"
          (( available_kb >= required_kb ))

      - name: Install isolated Bun
        id: setup_bun
        shell: bash
        env:
          BUN_VERSION: "1.3.14"
          BUN_SHA256: "a063908ae08b7852ca10939bbdc6ceed3ddabce8fb9402dce83d65d73b36e6c7"
        run: |
          set -euo pipefail

          bun_root="${RUNNER_TEMP}/zsolution-bun-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive="${bun_root}/bun-linux-x64-baseline.zip"
          bun_path="${bun_root}/bun"
          mkdir -p "${bun_root}"

          python3 - "${BUN_VERSION}" "${archive}" <<'PY'
          import shutil
          import sys
          import urllib.request

          version, destination = sys.argv[1:]
          url = f"https://github.com/oven-sh/bun/releases/download/bun-v{version}/bun-linux-x64-baseline.zip"
          request = urllib.request.Request(url, headers={"User-Agent": "zsolution-self-hosted-ci"})
          with urllib.request.urlopen(request, timeout=60) as response, open(destination, "wb") as output:
              shutil.copyfileobj(response, output)
          PY

          actual_sha256="$(python3 - "${archive}" <<'PY'
          import hashlib
          import sys

          digest = hashlib.sha256()
          with open(sys.argv[1], "rb") as archive:
              for chunk in iter(lambda: archive.read(1024 * 1024), b""):
                  digest.update(chunk)
          print(digest.hexdigest())
          PY
          )"
          [[ "${actual_sha256}" == "${BUN_SHA256}" ]]

          python3 - "${archive}" "${bun_path}" <<'PY'
          import shutil
          import sys
          import zipfile

          archive, destination = sys.argv[1:]
          with zipfile.ZipFile(archive) as bundle, bundle.open("bun-linux-x64-baseline/bun") as source:
              with open(destination, "wb") as output:
                  shutil.copyfileobj(source, output)
          PY
          chmod 0755 "${bun_path}"
          rm -f "${archive}"
          "${bun_path}" --version
          echo "path=${bun_path}" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_bun_executable: ${{ steps.setup_bun.outputs.path }}
          claude_args: "--model ${{ inputs.model }}"

      - name: Cleanup isolated Bun
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          bun_root="${RUNNER_TEMP}/zsolution-bun-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "${bun_root}" == "${RUNNER_TEMP}"/zsolution-bun-* ]]
          rm -rf -- "${bun_root}"
