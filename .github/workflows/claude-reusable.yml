name: Claude Code (reusable)

# Reusable workflow: phản hồi khi được tag @claude.
# Các repo trong org gọi workflow này qua `uses:` + `secrets: inherit`.
# KHÔNG đặt trigger ở đây — trigger nằm ở caller workflow của từng repo.
on:
  workflow_call:
    inputs:
      model:
        description: "Model Claude sử dụng"
        type: string
        required: false
        default: "claude-opus-4-8"
    secrets:
      ANTHROPIC_API_KEY:
        description: "API key cho endpoint Anthropic-compatible"
        required: true
      ANTHROPIC_BASE_URL:
        description: "Endpoint tùy chỉnh (Anthropic-compatible)"
        required: true

jobs:
  claude:
    # Chỉ chạy khi nội dung có chứa "@claude"
    if: |
      github.repository_owner == 'zsolution-vn' &&
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Cho phép Claude đọc kết quả CI trên PR
    steps:
      - name: Validate self-hosted runner
        shell: bash
        run: |
          set -euo pipefail

          [[ "$(uname -s)" == "Linux" ]]
          [[ "$(uname -m)" == "x86_64" ]]
          command -v python3 >/dev/null

          available_kb="$(df -Pk "${RUNNER_TEMP}" | awk 'NR == 2 { print $4 }')"
          required_kb="$((2 * 1024 * 1024))"
          (( available_kb >= required_kb ))

      - name: Install isolated unzip shim
        shell: bash
        run: |
          set -euo pipefail

          shim_dir="${RUNNER_TEMP}/zsolution-bin"
          mkdir -p "${shim_dir}"
          python3 - "${shim_dir}/unzip" <<'PY'
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(
          '''#!/usr/bin/env python3
          import sys
          import zipfile
          from pathlib import Path

          args = sys.argv[1:]
          archive = None
          destination = "."
          members = []
          index = 0

          while index < len(args):
              argument = args[index]
              if argument == "-d":
                  index += 1
                  destination = args[index]
              elif argument.startswith("-"):
                  unsupported = set(argument[1:]) - {"o", "q"}
                  if unsupported:
                      raise SystemExit(f"unsupported unzip option: {argument}")
              elif archive is None:
                  archive = argument
              else:
                  members.append(argument)
              index += 1

          if archive is None:
              raise SystemExit("usage: unzip [-oq] archive [-d destination]")

          with zipfile.ZipFile(archive) as bundle:
              selected = bundle.infolist() if not members else [bundle.getinfo(name) for name in members]
              bundle.extractall(destination, selected)

              for member in selected:
                  mode = (member.external_attr >> 16) & 0o777
                  if mode and not member.is_dir():
                      (Path(destination) / member.filename).chmod(mode)
          ''',
              encoding="utf-8",
          )
          PY
          chmod +x "${shim_dir}/unzip"
          echo "${shim_dir}" >> "${GITHUB_PATH}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model ${{ inputs.model }}"
