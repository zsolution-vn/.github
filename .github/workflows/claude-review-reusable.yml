name: Claude Code Review (reusable)

# Reusable workflow: tự động review PR.
# Các repo trong org gọi workflow này qua `uses:` + `secrets: inherit`.
on:
  workflow_call:
    inputs:
      model:
        description: "Model Claude sử dụng"
        type: string
        required: false
        default: "claude-opus-4-8"
    secrets:
      ANTHROPIC_API_KEY:
        description: "API key cho endpoint Anthropic-compatible"
        required: true
      ANTHROPIC_BASE_URL:
        description: "Endpoint tùy chỉnh (Anthropic-compatible)"
        required: true

jobs:
  claude-review:
    if: github.repository_owner == 'zsolution-vn'
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Cho phép Claude đọc kết quả CI trên PR
    steps:
      - name: Validate self-hosted runner
        shell: bash
        run: |
          set -euo pipefail

          [[ "$(uname -s)" == "Linux" ]]
          [[ "$(uname -m)" == "x86_64" ]]
          command -v python3 >/dev/null

          available_kb="$(df -Pk "${RUNNER_TEMP}" | awk 'NR == 2 { print $4 }')"
          required_kb="$((2 * 1024 * 1024))"
          (( available_kb >= required_kb ))

      - name: Install isolated unzip shim
        shell: bash
        run: |
          set -euo pipefail

          shim_dir="${RUNNER_TEMP}/zsolution-bin"
          mkdir -p "${shim_dir}"
          python3 - "${shim_dir}/unzip" <<'PY'
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(
          '''#!/usr/bin/env python3
          import sys
          import zipfile
          from pathlib import Path

          args = sys.argv[1:]
          archive = None
          destination = "."
          members = []
          index = 0

          while index < len(args):
              argument = args[index]
              if argument == "-d":
                  index += 1
                  destination = args[index]
              elif argument.startswith("-"):
                  unsupported = set(argument[1:]) - {"o", "q"}
                  if unsupported:
                      raise SystemExit(f"unsupported unzip option: {argument}")
              elif archive is None:
                  archive = argument
              else:
                  members.append(argument)
              index += 1

          if archive is None:
              raise SystemExit("usage: unzip [-oq] archive [-d destination]")

          with zipfile.ZipFile(archive) as bundle:
              selected = bundle.infolist() if not members else [bundle.getinfo(name) for name in members]
              bundle.extractall(destination, selected)

              for member in selected:
                  mode = (member.external_attr >> 16) & 0o777
                  target = Path(destination) / member.filename
                  if member.is_dir():
                      continue
                  if target.name in {"bun", "bunx", "node"}:
                      target.chmod((mode or 0o644) | 0o111)
                  elif mode:
                      target.chmod(mode)
          ''',
              encoding="utf-8",
          )
          PY
          chmod +x "${shim_dir}/unzip"
          echo "${shim_dir}" >> "${GITHUB_PATH}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Hãy review pull request này và để lại nhận xét trực tiếp lên các dòng code.
            Tập trung vào:
            - Chất lượng code và tính dễ đọc
            - Lỗi tiềm ẩn và edge case chưa xử lý
            - Vấn đề bảo mật (input chưa validate, secret hardcode, injection, XSS...)
            - Hiệu năng (N+1 query, vòng lặp tốn kém, thiếu phân trang)
            - Độ bao phủ test cho phần thay đổi

            Dùng `gh pr comment` để tóm tắt và `gh api` để comment theo từng dòng.
            Mang tính xây dựng, ưu tiên các vấn đề CRITICAL/HIGH. Viết bằng tiếng Việt.
          claude_args: |
            --model ${{ inputs.model }}
            --allowed-tools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
