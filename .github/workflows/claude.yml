name: Claude Code

# Caller: gọi reusable workflow của org cho chính repo .github này.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    uses: ./.github/workflows/claude-reusable.yml
    secrets: inherit
    # with:
    #   model: claude-opus-4-8
